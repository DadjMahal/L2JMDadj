<!doctype html>
<!--
  AI Fleet Dashboard — DEV / modular source shell (index.src.html).
  This file is the maintainable modular source: it references the external
  css/style.css, js/map.js, js/app.js and fetches data/*.json at runtime.

  The SERVED file (dashboard/index.html) is a self-contained minified bundle
  GENERATED from this file by:  scripts/build_dashboard.sh
  Do not hand-edit index.html (it is overwritten on every build).

  STRUCTURAL EDIT POINTS (kept stable for merge coordination):
    * <div id="mapPanel">      — WPT-10 pan/zoom map (map.js renders into #map)
    * <div id="gridPanel">     — bot grid (app.js renderGrid)
    * <div id="eventsPanel">   — live event feed (app.js renderEvents)
    * <div id="detailPanel">   — bot detail view (app.js renderDetail)
    * header buttons + fOnline/fState filters + #meta — wired in app.js
  The DOM ids above form the contract shared with frontend-spa.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Fleet Dashboard — Interlude</title>
<!--DEV-CSS--><link rel="stylesheet" href="css/style.css"><!--/DEV-CSS-->
<!--__CSSTAG__-->
</head>
<body>
<header>
  <h1>🤖 AI FLEET — INTERLUDE :7777</h1>
  <span class="meta" id="meta">loading…</span>
  <span class="meta keys">M map · G grid · E events · D detail · T trails</span>
  <div class="spacer"></div>
  <div class="seg">
    <button id="btnMap" class="on" onclick="setView('map')">🗺️ Map</button>
    <button id="btnGrid" onclick="setView('grid')">📋 Grid</button>
    <button id="btnEvents" onclick="setView('events')">📡 Events</button>
    <button id="btnTheme" onclick="toggleTheme()" title="toggle dark/light theme">🌗 Theme</button>
  </div>
</header>

<div class="panel" id="mapPanel">
  <div id="mapWrap">
    <svg id="map"></svg>
    <div id="mapLegend">
      <span class="lg"><span class="dot" style="background:var(--accent)"></span>Players</span>
      <span class="lg"><span class="dot" style="background:var(--red)"></span>Hostiles</span>
      <span class="lg"><span class="dot" style="background:var(--gr)"></span>NPCs</span>
      <span class="lg"><span class="dot" style="background:var(--pu)"></span>Towns</span>
      <span class="lg"><span class="dot" style="background:var(--or)"></span>Target line</span>
      <span class="lg"><span class="dot" style="background:var(--cy)"></span>Regions</span>
    </div>
    <div id="mapControls">
      <button onclick="window.MapRenderer.zoomIn()" title="zoom in">＋</button>
      <button onclick="window.MapRenderer.zoomOut()" title="zoom out">－</button>
      <button onclick="window.MapRenderer.fit()" title="fit map to world">⤢</button>
    </div>
    <div class="tooltip" id="tip"></div>
  </div>
</div>

<div class="panel" id="gridPanel" style="display:none">
  <div class="gridbar">
    <select id="fOnline" onchange="renderGrid()">
      <option value="">Online: all</option>
      <option value="1">Online only</option>
      <option value="0">Offline only</option>
    </select>
    <select id="fState" onchange="renderGrid()"></select>
    <button onclick="exportCsv()" title="download current grid rows as CSV">⬇ CSV</button>
    <span class="meta" id="gridCount"></span>
  </div>
  <div id="gridTbl"></div>
</div>

<div class="panel" id="eventsPanel" style="display:none">
  <div class="gridbar">
    <span class="meta">Live event feed — newest first · capped at 200</span>
    <div class="spacer"></div>
    <button onclick="clearEvents()">Clear</button>
  </div>
  <div id="eventsTbl"></div>
</div>

<div class="panel" id="detailPanel" style="display:none">
  <div class="detail" id="detailBody"></div>
</div>

<!--DEV-JS--><script src="js/map.js"></script><script src="js/app.js"></script><!--/DEV-JS-->
<!--__JSTAG__-->
</body>
</html>
