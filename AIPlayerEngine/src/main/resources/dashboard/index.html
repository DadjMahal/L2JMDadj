*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Segoe UI',Roboto,system-ui,sans-serif;padding:14px 18px;transition:background .3s,color .3s}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
h1{margin:0;font-size:18px;color:var(--accent);letter-spacing:1px}
.meta{color:var(--dim);font-size:12px}
.keys{font-size:11px;letter-spacing:.3px}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:var(--txt);border:0;padding:7px 14px;cursor:pointer;font-size:13px}
.seg button:hover{background:rgba(255,255,255,.06)}
.seg button.on{background:var(--accent);color:var(--tagtxt);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px}
#mapWrap{position:relative;height:72vh;overflow:hidden}
#map{width:100%;height:100%}
#mapLegend{position:absolute;top:10px;left:10px;background:var(--chipbg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:11px;line-height:1.7}
.lg{display:inline-flex;align-items:center;gap:6px;margin-right:12px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.plr2{animation:pulse2 1.6s ease-out infinite}
@keyframes pulse2{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.mlabel{fill:var(--txthi);font-weight:700}
.sublabel{fill:var(--txsub);font-size:9px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;position:sticky;top:0;background:var(--panel)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--accent)}
th .arr{margin-left:4px;color:var(--accent)}
tr:hover{background:var(--hover)}
.bar{height:7px;border-radius:4px;background:var(--bar);overflow:hidden;min-width:70px}
.bar>div{height:100%;transition:width .6s ease}
.st{font-weight:700}
.st-ATTACK,.st-ENGAGE_TARGET,.st-USE_SKILL,.st-engage{color:var(--red)}
.st-FLEE,.st-RETREAT{color:var(--or)}
.st-wander{color:var(--cy)}
.st-IDLE,.st-idle{color:var(--lm)}
.st-dead{color:var(--dim)}
.online{color:var(--gr);font-weight:700}
.offline{color:var(--red);font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
#gridTbl{height:65vh;overflow:auto}
.th{color:var(--pu)}
.gridbar{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.gridbar select,.gridbar button{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer}
.gridbar select:hover,.gridbar button:hover{border-color:var(--accent)}
.gridbar button.primary{background:var(--accent);color:var(--tagtxt);border-color:var(--accent);font-weight:700}
#eventsTbl{height:65vh;overflow:auto}
.ev{display:flex;gap:9px;align-items:baseline;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12px}
.ev .t{color:var(--dim);font-size:11px;white-space:nowrap}
.ev .bot{font-weight:600;white-space:nowrap}
.ev .body{word-break:break-word;white-space:pre-wrap}
.tag{display:inline-block;padding:1px 8px;border-radius:8px;font-size:10px;font-weight:700;color:var(--tagtxt);white-space:nowrap;flex-shrink:0}
.ev-kill .tag{background:var(--red)} .ev-kill .bot{color:var(--red)}
.ev-level .tag{background:var(--gr)} .ev-level .bot{color:var(--gr)}
.ev-skill .tag{background:var(--pu)} .ev-skill .bot{color:var(--pu)}
.ev-dmg .tag{background:var(--or)} .ev-dmg .bot{color:var(--or)}
.ev-chat .tag{background:var(--bl)} .ev-chat .bot{color:var(--bl)}
.ev-sys .tag{background:var(--pu)} .ev-sys .bot{color:var(--pu)}
.ev-conn .tag,.ev-disc .tag{background:var(--dim)} .ev-conn .bot,.ev-disc .bot{color:var(--dim)}
.ev-move .tag{background:var(--cy)} .ev-move .bot{color:var(--cy)}
.ev-other .tag{background:var(--line)} .ev-other .bot{color:var(--dim)}
.detail{font-size:13px;line-height:1.7}
.detail h2{margin:0 0 6px;color:var(--accent)}
.dstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:12px}
.dcard{background:var(--hover);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.dcard .k{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.dcard .v{font-size:13px;margin-top:2px}
.dnav{display:flex;gap:8px;margin-top:10px}
.dnav button{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12px}
.dnav button:hover{border-color:var(--accent)}
.tooltip{pointer-events:none;position:absolute;background:var(--chipbg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:11px;line-height:1.55;display:none;z-index:9;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.tick{color:var(--dim);font-size:11px}
.xp,.hp,.mp{text-align:left;font-size:11px}
.float{position:absolute;font-size:10px;color:var(--txsub);text-shadow:0 0 4px #000;pointer-events:none}
#mapControls{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
#mapControls button{width:28px;height:28px;background:var(--chipbg);border:1px solid var(--line);color:var(--txt);border-radius:6px;font-size:15px;cursor:pointer;line-height:1}
#mapControls button:hover{border-color:var(--accent);color:var(--accent)}
.playbar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:12px;flex-wrap:wrap}
.playbar button{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:5px 11px;cursor:pointer;font-size:12px;line-height:1}
.playbar button:hover{border-color:var(--accent);color:var(--accent)}
.playbar button:disabled{opacity:.45;cursor:default}
.playbar button:disabled:hover{border-color:var(--line);color:var(--txt)}
#pbPlay{background:var(--accent);color:var(--tagtxt);border-color:var(--accent);font-weight:700;min-width:38px}
.playbar input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.playbar select{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:4px 6px;font-size:12px;cursor:pointer}
.playbar .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.playbar .meta#pbStatus{color:var(--accent)}

body{padding:8px 10px}
h1{font-size:15px}
.seg button{padding:6px 9px;font-size:12px}
#mapWrap{height:55vh}
#gridTbl,#eventsTbl{height:58vh}
}</style>

<header>
  <h1>🤖 AI FLEET — INTERLUDE :7777</h1>
  <span class="meta" id="meta">loading…</span>
  <span class="meta keys">M map · G grid · E events · D detail · T trails · P playback</span>
  <div class="spacer"></div>
  <div class="seg">
    <button id="btnMap" class="on" onclick="setView('map')">🗺️ Map</button>
    <button id="btnGrid" onclick="setView('grid')">📋 Grid</button>
    <button id="btnEvents" onclick="setView('events')">📡 Events</button>
    <button id="btnPlayback" onclick="pbToggle()" title="replay recorded bot state from /api/v1/history">▶ Playback</button>
    <button id="btnTheme" onclick="toggleTheme()" title="toggle dark/light theme">🌗 Theme</button>
  </div>
</header>

<div class="panel" id="mapPanel">
  <div id="mapWrap">
    <svg id="map"></svg>
    <div id="mapLegend">
      <span class="lg"><span class="dot" style="background:var(--accent)"></span>Players</span>
      <span class="lg"><span class="dot" style="background:var(--red)"></span>Hostiles</span>
      <span class="lg"><span class="dot" style="background:var(--gr)"></span>NPCs</span>
      <span class="lg"><span class="dot" style="background:var(--pu)"></span>Towns</span>
      <span class="lg"><span class="dot" style="background:var(--or)"></span>Target line</span>
      <span class="lg"><span class="dot" style="background:var(--cy)"></span>Regions</span>
    </div>
    <div id="mapControls">
      <button onclick="window.MapRenderer.zoomIn()" title="zoom in">＋</button>
      <button onclick="window.MapRenderer.zoomOut()" title="zoom out">－</button>
      <button onclick="window.MapRenderer.fit()" title="fit map to world">⤢</button>
    </div>
    <div class="tooltip" id="tip"></div>
  </div>
</div>

<div class="panel" id="gridPanel" style="display:none">
  <div class="gridbar">
    <select id="fOnline" onchange="renderGrid()">
      <option value="">Online: all</option>
      <option value="1">Online only</option>
      <option value="0">Offline only</option>
    </select>
    <select id="fState" onchange="renderGrid()"></select>
    <button onclick="exportCsv()" title="download current grid rows as CSV">⬇ CSV</button>
    <span class="meta" id="gridCount"></span>
  </div>
  <div id="gridTbl"></div>
</div>

<div class="panel" id="eventsPanel" style="display:none">
  <div class="gridbar">
    <span class="meta" id="eventsNote">Live event feed — newest first · capped at 200</span>
    <div class="spacer"></div>
    <button onclick="clearEvents()">Clear</button>
  </div>
  <div id="eventsTbl"></div>
</div>

<div class="panel" id="detailPanel" style="display:none">
  <div class="detail" id="detailBody"></div>
</div>

<!-- WPT-12 — state playback / replay control bar (reads real /api/v1/history). -->
<div class="playbar" id="playbar" style="display:none">
  <button id="pbPlay" onclick="pbTogglePlay()" title="play/pause replay">▶</button>
  <button onclick="pbStep(-1)" title="step back one frame">⏮</button>
  <button onclick="pbStep(1)" title="step forward one frame">⏭</button>
  <input type="range" id="pbSlider" min="0" max="0" value="0" oninput="pbScrub(this.value)" title="scrub through recorded frames">
  <select id="pbSpeed" onchange="pbSetSpeed(this.value)" title="playback speed">
    <option value="1000">0.5×</option>
    <option value="500">1×</option>
    <option value="250" selected>2×</option>
    <option value="100">5×</option>
    <option value="50">10×</option>
  </select>
  <button onclick="pbLoad()" title="reload history from /api/v1/history">⟳</button>
  <span class="meta" id="pbTime"></span>
  <span class="meta" id="pbStatus"></span>
  <div class="spacer"></div>
  <button onclick="pbExit()" title="exit playback">✕</button>
</div>

if (PB.playing) { if (PB.timer) clearInterval(PB.timer); PB.timer = setInterval(pbTick, Math.max(50, PB.speed)); }
}
function renderPlaybackEvents() {
var f = PB.frames[PB.idx];
var lo = 0, hi = Number.MAX_VALUE;
if (f) { lo = PB.idx > 0 ? PB.frames[PB.idx - 1].t + 1 : 0; hi = f.t; }
var list = events.filter(function (ev) { return ev.t >= lo && ev.t <= hi; });
var note = 'PLAYBACK: events in frame window ';
note += (PB.loaded && PB.frames.length) ? (fmtPBT(lo === 0 ? PB.spanStart : lo) + ' → ' + fmtPBT(hi)) : '—';
if ($('eventsNote')) $('eventsNote').textContent = note;
renderEvents(list);
}
function pbRenderUI() {
if (!$('playbar')) return;
var f = PB.frames[PB.idx];
$('pbPlay').textContent = PB.playing ? '⏸' : '▶';
var sl = $('pbSlider');
if (sl) { sl.max = PB.frames.length ? PB.frames.length - 1 : 0; sl.value = PB.idx; sl.disabled = !PB.frames.length; }
var msg;
if (PB.loading) msg = 'loading history…';
else if (!PB.loaded) msg = PB.err ? 'history error: ' + PB.err : 'not loaded';
else if (!PB.frames.length) msg = 'no recorded snapshots — /api/v1/history is empty';
else msg = 'frame ' + (PB.idx + 1) + '/' + PB.frames.length + ' · ' + PB.nTotal + ' snapshots · ' + PB.botNames.length + ' bots · ' + fmtPBT(PB.spanStart) + '→' + fmtPBT(PB.spanEnd);
$('pbStatus').textContent = msg;
$('pbTime').textContent = f ? fmtPBT(f.t) + ' +' + Math.round((f.t - PB.spanStart) / 1000) + 's' : '-';
}
function applyTheme(t) { document.body.setAttribute('data-theme', t); localStorage.setItem('fleetTheme', t); }
function initTheme() { applyTheme(localStorage.getItem('fleetTheme') || 'dark'); }
function toggleTheme() { applyTheme(document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light'); }
document.addEventListener('keydown', function (e) {
var tag = (e.target && e.target.tagName) || '';
if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
var k = e.key.toLowerCase();
if (k === 'm') setView('map');
else if (k === 'g') setView('grid');
else if (k === 'e') setView('events');
else if (k === 'd') { detailIndex = 0; setView('detail'); }
else if (k === 't') toggleTrails();
else if (k === 'p') pbToggle();
});
initTheme();
setInterval(poll, 2000);
window._t0 = Date.now();
poll();</script>
