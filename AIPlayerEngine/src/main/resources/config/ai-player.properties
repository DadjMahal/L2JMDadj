# =============================================================================
# Phase 0 upgrade (Tasks 1-11). ALL features default OFF => previous behavior.
# Enable deliberately, one subsystem at a time, after its tests + live probe.
# See Documentation/Audit/43 (runtime wiring) and INTEGRATION_GAPS.md (gaps).
