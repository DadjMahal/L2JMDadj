engine.movement=false
engine.movement.idle_route_ms=20000
engine.movement.min_radius=4000
engine.movement.max_radius=30000
engine.reaction_base_ms=250
engine.reaction_sigma_ms=60
engine.reaction_outlier_pct=10
engine.reaction_outlier_ms=1200
